          "name": "¿Necesito saber dibujar o pintar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. La arteterapia no busca resultados estéticos ni habilidad artística. El objetivo tampoco es aprender a dibujar o pintar, sino utilizar el proceso artístico como un medio."

          "@type": "Question",

        },

          "@type": "Question",
          "name": "¿Las sesiones son online o presenciales?",

            "@type": "Answer",
            "text": "Ambas modalidades están disponibles: presencial en Barcelona y Sant Cugat, u online (solo adultos)."

        },

          "@type": "Question",
          "name": "¿Cómo sé si la arteterapia es adecuada para mi hijo o hija?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En la primera entrevista conversamos sobre la situación particular y evaluamos juntos/as si este es el espacio adecuado."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto dura el proceso terapéutico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada proceso de arteterapia es único, por lo que su duración se adapta a las necesidades y objetivos de cada persona. En general, puede organizarse en módulos de 12 sesiones. Al finalizar cada módulo, se realiza una valoración conjunta para decidir la continuidad del proceso."
          }
        }
      ]
    }
